<!-- wp:template-part {"slug":"header","tagName":"header","area":"header"} /-->

<main class="slv-product-detail">

    <!-- 面包屑 -->
    <div class="slv-product-detail__breadcrumb-wrap">
        <div class="slv-product-detail__container">
            <nav class="slv-breadcrumb" aria-label="面包屑">
                <a href="/">首页</a>
                <span aria-hidden="true">/</span>
                <a href="/products/">商品</a>
                <span aria-hidden="true">/</span>
                <span class="slv-breadcrumb__current"></span>
            </nav>
        </div>
    </div>

    <!-- 主体：左图册 + 右信息 -->
    <div class="slv-product-detail__body">
        <div class="slv-product-detail__container">
            <div class="slv-product-detail__grid">

                <!-- 左：图册 -->
                <div class="slv-product-gallery" data-slv-gallery>
                    <div class="slv-product-gallery__main">
                        <!-- wp:post-featured-image {"aspectRatio":"1","className":"slv-product-gallery__hero"} /-->
                        <div class="slv-product-gallery__badges">
                            <span class="slv-product-card__badge slv-product-card__badge--hot">热销</span>
                        </div>
                    </div>
                    <div class="slv-product-gallery__thumbs" data-slv-gallery-thumbs>
                        <!-- 缩略图由 JS 从 featured image + gallery 提取 -->
                    </div>
                </div>

                <!-- 右：商品信息 -->
                <div class="slv-product-info">

                    <!-- 分类 + 标题 -->
                    <div class="slv-product-info__meta">
                        <!-- wp:post-terms {"term":"product_cat","separator":" / "} /-->
                    </div>
                    <!-- wp:post-title {"level":1,"className":"slv-product-info__title"} /-->

                    <!-- 评分 -->
                    <div class="slv-product-info__rating">
                        <div class="slv-stars">
                            <svg class="slv-icon slv-icon--filled" width="16" height="16"><use href="#slv-icon-star"></use></svg>
                            <svg class="slv-icon slv-icon--filled" width="16" height="16"><use href="#slv-icon-star"></use></svg>
                            <svg class="slv-icon slv-icon--filled" width="16" height="16"><use href="#slv-icon-star"></use></svg>
                            <svg class="slv-icon slv-icon--filled" width="16" height="16"><use href="#slv-icon-star"></use></svg>
                            <svg class="slv-icon slv-icon--filled" width="16" height="16"><use href="#slv-icon-star"></use></svg>
                        </div>
                        <span class="slv-product-info__rating-text">4.9 · 128 条评价</span>
                    </div>

                    <!-- 价格 -->
                    <div class="slv-product-info__price-wrap">
                        <div class="slv-product-info__price" data-slv-price>
                            <span class="slv-product-info__currency">¥</span>
                            <span class="slv-product-info__amount">—</span>
                        </div>
                        <div class="slv-product-info__compare" data-slv-compare hidden>
                            <span class="slv-product-info__compare-label">原价</span>
                            <span class="slv-product-info__compare-value">¥ —</span>
                        </div>
                    </div>

                    <!-- 简述 -->
                    <!-- wp:post-excerpt {"className":"slv-product-info__excerpt","excerptLength":40} /-->

                    <!-- 规格/属性 -->
                    <div class="slv-product-info__specs">
                        <div class="slv-product-info__spec">
                            <span class="slv-product-info__spec-label">SKU</span>
                            <span class="slv-product-info__spec-value" data-slv-sku>—</span>
                        </div>
                        <div class="slv-product-info__spec">
                            <span class="slv-product-info__spec-label">库存</span>
                            <span class="slv-product-info__spec-value slv-product-info__spec-value--stock" data-slv-stock>—</span>
                        </div>
                        <div class="slv-product-info__spec">
                            <span class="slv-product-info__spec-label">起订量</span>
                            <span class="slv-product-info__spec-value" data-slv-moq>—</span>
                        </div>
                        <div class="slv-product-info__spec">
                            <span class="slv-product-info__spec-label">交货周期</span>
                            <span class="slv-product-info__spec-value" data-slv-lead-time>—</span>
                        </div>
                    </div>

                    <!-- 数量 + 加购 -->
                    <div class="slv-product-info__actions">
                        <div class="slv-quantity">
                            <button type="button" class="slv-quantity__btn" data-slv-qty-minus aria-label="减少">
                                <svg class="slv-icon" width="16" height="16" aria-hidden="true"><use href="#slv-icon-minus"></use></svg>
                            </button>
                            <input type="number" class="slv-quantity__input" data-slv-qty value="1" min="1" aria-label="数量" />
                            <button type="button" class="slv-quantity__btn" data-slv-qty-plus aria-label="增加">
                                <svg class="slv-icon" width="16" height="16" aria-hidden="true"><use href="#slv-icon-plus"></use></svg>
                            </button>
                        </div>
                        <button type="button" class="slv-button slv-button--lg slv-button--block" data-slv-add-to-cart>
                            <svg class="slv-icon" width="18" height="18" aria-hidden="true"><use href="#slv-icon-shopping-cart"></use></svg>
                            加入购物车
                        </button>
                        <button type="button" class="slv-button slv-button--lg slv-button--secondary slv-button--block" data-slv-buy-now>
                            立即购买
                        </button>
                    </div>

                    <!-- 询盘（B2B 场景） -->
                    <button type="button" class="slv-product-info__inquiry" data-slv-open-inquiry>
                        <svg class="slv-icon" width="18" height="18" aria-hidden="true"><use href="#slv-icon-file-text"></use></svg>
                        批量采购？发送询盘
                    </button>

                    <!-- 保障 -->
                    <div class="slv-product-info__trust">
                        <div class="slv-product-info__trust-item">
                            <svg class="slv-icon" width="20" height="20" aria-hidden="true"><use href="#slv-icon-shield-check"></use></svg>
                            <span>正品保障</span>
                        </div>
                        <div class="slv-product-info__trust-item">
                            <svg class="slv-icon" width="20" height="20" aria-hidden="true"><use href="#slv-icon-truck"></use></svg>
                            <span>全球配送</span>
                        </div>
                        <div class="slv-product-info__trust-item">
                            <svg class="slv-icon" width="20" height="20" aria-hidden="true"><use href="#slv-icon-circle-check"></use></svg>
                            <span>7 天无理由退换</span>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </div>

    <!-- Tab 区：描述 / 规格 / 评价 / FAQ -->
    <div class="slv-product-tabs">
        <div class="slv-product-detail__container">
            <div class="slv-product-tabs__nav" role="tablist">
                <button type="button" role="tab" class="slv-product-tabs__tab is-active" data-slv-tab="desc" aria-selected="true">商品描述</button>
                <button type="button" role="tab" class="slv-product-tabs__tab" data-slv-tab="specs" aria-selected="false">规格参数</button>
                <button type="button" role="tab" class="slv-product-tabs__tab" data-slv-tab="reviews" aria-selected="false">用户评价</button>
                <button type="button" role="tab" class="slv-product-tabs__tab" data-slv-tab="faq" aria-selected="false">常见问题</button>
            </div>

            <div class="slv-product-tabs__panel is-active" data-slv-panel="desc">
                <div class="slv-prose">
                    <!-- wp:post-content /-->
                </div>
            </div>

            <div class="slv-product-tabs__panel" data-slv-panel="specs" hidden>
                <table class="slv-product-specs">
                    <tbody>
                        <tr><th>SKU</th><td data-slv-sku>—</td></tr>
                        <tr><th>重量</th><td>1.2 kg</td></tr>
                        <tr><th>尺寸</th><td>30 × 20 × 10 cm</td></tr>
                        <tr><th>HS 编码</th><td data-slv-hs>—</td></tr>
                        <tr><th>起订量</th><td data-slv-moq>—</td></tr>
                    </tbody>
                </table>
            </div>

            <div class="slv-product-tabs__panel" data-slv-panel="reviews" hidden>
                <div class="slv-product-reviews">
                    <div class="slv-product-reviews__summary">
                        <div class="slv-product-reviews__score">4.9</div>
                        <div class="slv-product-reviews__stars">
                            <svg class="slv-icon slv-icon--filled" width="18" height="18"><use href="#slv-icon-star"></use></svg>
                            <svg class="slv-icon slv-icon--filled" width="18" height="18"><use href="#slv-icon-star"></use></svg>
                            <svg class="slv-icon slv-icon--filled" width="18" height="18"><use href="#slv-icon-star"></use></svg>
                            <svg class="slv-icon slv-icon--filled" width="18" height="18"><use href="#slv-icon-star"></use></svg>
                            <svg class="slv-icon slv-icon--filled" width="18" height="18"><use href="#slv-icon-star"></use></svg>
                        </div>
                        <div class="slv-product-reviews__count">共 128 条评价</div>
                    </div>
                    <div class="slv-product-reviews__list">
                        <!-- 占位评价 -->
                        <div class="slv-review">
                            <div class="slv-review__head">
                                <div class="slv-review__avatar">李</div>
                                <div class="slv-review__meta">
                                    <div class="slv-review__name">李女士</div>
                                    <div class="slv-review__stars">
                                        <svg class="slv-icon slv-icon--filled" width="14" height="14"><use href="#slv-icon-star"></use></svg>
                                        <svg class="slv-icon slv-icon--filled" width="14" height="14"><use href="#slv-icon-star"></use></svg>
                                        <svg class="slv-icon slv-icon--filled" width="14" height="14"><use href="#slv-icon-star"></use></svg>
                                        <svg class="slv-icon slv-icon--filled" width="14" height="14"><use href="#slv-icon-star"></use></svg>
                                        <svg class="slv-icon slv-icon--filled" width="14" height="14"><use href="#slv-icon-star"></use></svg>
                                    </div>
                                </div>
                                <div class="slv-review__date">2026-09-15</div>
                            </div>
                            <p class="slv-review__content">功能完整，文档齐全，集成 2 天就跑通了，非常推荐。</p>
                        </div>
                    </div>
                </div>
            </div>

            <div class="slv-product-tabs__panel" data-slv-panel="faq" hidden>
                <div class="slv-product-faq">
                    <details class="slv-faq__item">
                        <summary class="slv-faq__q">
                            <span>支持哪些支付方式？</span>
                            <svg class="slv-icon" width="16" height="16"><use href="#slv-icon-chevron-down"></use></svg>
                        </summary>
                        <div class="slv-faq__a">国际：Stripe / PayPal；国内：微信支付 / 支付宝 / 银联。</div>
                    </details>
                    <details class="slv-faq__item">
                        <summary class="slv-faq__q">
                            <span>多久能发货？</span>
                            <svg class="slv-icon" width="16" height="16"><use href="#slv-icon-chevron-down"></use></svg>
                        </summary>
                        <div class="slv-faq__a">现货商品 24 小时内发货；定制商品按交货周期。</div>
                    </details>
                </div>
            </div>
        </div>
    </div>

    <!-- 相关商品 -->
    <div class="slv-related-products">
        <div class="slv-product-detail__container">
            <h2 class="slv-section__title">相关商品</h2>
            <div class="slv-related-products__grid">
                <!-- wp:query {"queryId":11,"query":{"perPage":4,"postType":"product","order":"desc","orderBy":"rand","inherit":false},"layout":{"type":"grid","columnCount":4}} -->
                <div class="wp-block-query">
                    <!-- wp:post-template -->
                        <!-- wp:group {"className":"slv-product-card"} -->
                        <div class="wp-block-group slv-product-card">
                            <!-- wp:post-featured-image {"isLink":true,"aspectRatio":"1"} /-->
                            <!-- wp:post-title {"level":3,"isLink":true} /-->
                        </div>
                        <!-- /wp:group -->
                    <!-- /wp:post-template -->
                </div>
                <!-- /wp:query -->
            </div>
        </div>
    </div>

</main>

<!-- 询盘弹窗 -->
<div class="slv-inquiry-modal" data-slv-inquiry-modal hidden>
    <div class="slv-inquiry-modal__mask" data-slv-close-inquiry></div>
    <div class="slv-inquiry-modal__panel" role="dialog" aria-modal="true">
        <button type="button" class="slv-inquiry-modal__close" data-slv-close-inquiry aria-label="关闭">
            <svg class="slv-icon" width="20" height="20"><use href="#slv-icon-x"></use></svg>
        </button>
        <h3>发送询盘</h3>
        <form class="slv-inquiry-form" data-slv-inquiry-form>
            <label>公司名称<input type="text" name="company" required /></label>
            <label>联系人<input type="text" name="name" required /></label>
            <label>邮箱<input type="email" name="email" required /></label>
            <label>采购数量<input type="number" name="qty" min="1" /></label>
            <label>备注<textarea name="message" rows="3"></textarea></label>
            <button type="submit" class="slv-button slv-button--block">提交询盘</button>
        </form>
    </div>
</div>
