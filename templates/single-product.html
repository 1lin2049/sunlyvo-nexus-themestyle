<!-- wp:template-part {"slug":"header","tagName":"header","area":"header"} /-->

<main class="slv-product-detail">

    <!-- 面包屑 -->
    <div class="slv-product-detail__breadcrumb">
        <nav class="slv-breadcrumb" aria-label="面包屑">
            <a href="/">首页</a>
            <span aria-hidden="true">/</span>
            <a href="/products/">商品</a>
            <span aria-hidden="true">/</span>
            <span data-slv-breadcrumb-current></span>
        </nav>
    </div>

    <!-- 主体 -->
    <!-- wp:group {"className":"slv-product-detail__grid","layout":{"type":"default"}} -->
    <div class="wp-block-group slv-product-detail__grid">

        <!-- 图册 -->
        <div class="slv-product-gallery" data-slv-gallery>
            <div class="slv-product-gallery__main" data-slv-gallery-main>
                <!-- wp:post-featured-image {"aspectRatio":"1"} /-->
            </div>
            <div class="slv-product-gallery__thumbs" data-slv-gallery-thumbs>
                <!-- wp:shortcode -->
                [slv_product_gallery_thumbs]
                <!-- /wp:shortcode -->
            </div>
        </div>

        <!-- 信息 -->
        <div class="slv-product-info">
            <div class="slv-product-info__cats">
                <!-- wp:post-terms {"term":"product_cat","separator":" · "} /-->
            </div>

            <!-- wp:post-title {"level":1,"className":"slv-product-info__title"} /-->

            <!-- wp:post-excerpt {"className":"slv-product-info__excerpt"} /-->

            <div class="slv-product-info__price-wrap">
                <span class="slv-product-info__price">
                    <span class="slv-product-info__currency">¥</span>
                    <span data-slv-product-price>0.00</span>
                </span>
            </div>

            <div class="slv-product-info__specs">
                <div class="slv-product-info__spec">
                    <span class="slv-product-info__spec-label">SKU</span>
                    <span class="slv-product-info__spec-value" data-slv-product-sku>—</span>
                </div>
                <div class="slv-product-info__spec">
                    <span class="slv-product-info__spec-label">库存</span>
                    <span class="slv-product-info__spec-value" data-slv-product-stock>有货</span>
                </div>
            </div>

            <div class="slv-product-info__actions">
                <button type="button" class="slv-button slv-button--secondary" data-slv-product-cart>
                    加入购物车
                </button>
                <button type="button" class="slv-button" data-slv-product-buy>
                    立即购买
                </button>
            </div>

            <div class="slv-product-info__perks">
                <div class="slv-product-info__perk">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>
                    <span>正品保障 · 假一赔十</span>
                </div>
                <div class="slv-product-info__perk">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>
                    <span>全球配送 · 7 天无理由退货</span>
                </div>
                <div class="slv-product-info__perk">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>
                    <span>安全支付 · Stripe / 微信 / 支付宝</span>
                </div>
            </div>
        </div>
    </div>
    <!-- /wp:group -->

    <!-- Tabs -->
    <div class="slv-product-tabs" data-slv-product-tabs>
        <div class="slv-product-tabs__nav">
            <button type="button" class="slv-product-tabs__tab is-active" data-slv-tab="desc">商品描述</button>
            <button type="button" class="slv-product-tabs__tab" data-slv-tab="specs">规格参数</button>
            <button type="button" class="slv-product-tabs__tab" data-slv-tab="reviews">用户评价</button>
        </div>

        <div class="slv-product-tabs__panel is-active" data-slv-panel="desc">
            <!-- wp:post-content {"className":"slv-prose"} /-->
        </div>
        <div class="slv-product-tabs__panel" data-slv-panel="specs">
            <div class="slv-prose">
                <p>规格信息待补充。</p>
            </div>
        </div>
        <div class="slv-product-tabs__panel" data-slv-panel="reviews">
            <div class="slv-prose">
                <p>暂无评价。</p>
            </div>
        </div>
    </div>

    <!-- 相关商品 -->
    <section class="slv-product-related">
        <h2 class="slv-product-related__title">相关商品</h2>
        <!-- wp:query {"queryId":30,"query":{"postType":"product","perPage":4,"order":"desc","orderBy":"rand","inherit":false},"layout":{"type":"default"}} -->
        <div class="wp-block-query">
            <!-- wp:post-template -->
                <!-- wp:group {"className":"slv-product-card","layout":{"type":"default"}} -->
                <div class="wp-block-group slv-product-card">
                    <a href="#" class="slv-product-card__media" data-slv-dynamic-link>
                        <!-- wp:post-featured-image {"aspectRatio":"1"} /-->
                    </a>
                    <div class="slv-product-card__body">
                        <!-- wp:post-title {"level":3,"isLink":true,"className":"slv-product-card__title"} /-->
                    </div>
                </div>
                <!-- /wp:group -->
            <!-- /wp:post-template -->
        </div>
        <!-- /wp:query -->
    </section>

</main>

<!-- wp:template-part {"slug":"footer","tagName":"footer","area":"footer"} /-->
