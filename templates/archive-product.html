<!-- wp:template-part {"slug":"header","tagName":"header","area":"header"} /-->

<main class="slv-product-list">

    <!-- ═══ 页面头 ═══ -->
    <section class="slv-page-hero">
        <div class="slv-page-hero__inner">
            <nav class="slv-breadcrumb" aria-label="面包屑">
                <a href="/">首页</a>
                <span aria-hidden="true">/</span>
                <span>商品</span>
            </nav>
            <h1 class="slv-page-hero__title">全部商品</h1>
            <p class="slv-page-hero__desc">精选优质商品，支持全球配送</p>
        </div>
    </section>

    <!-- ═══ 主体：左筛选 + 右网格 ═══ -->
    <div class="slv-product-list__body">

        <!-- 筛选栏 -->
        <aside class="slv-product-filter" data-slv-filter>
            <div class="slv-product-filter__header">
                <h2 class="slv-product-filter__title">筛选</h2>
                <button type="button" class="slv-product-filter__clear" data-slv-filter-clear>
                    <svg class="slv-icon" width="14" height="14" aria-hidden="true"><use href="#slv-icon-x"></use></svg>
                    清空
                </button>
            </div>

            <!-- 分类 -->
            <div class="slv-product-filter__group">
                <button type="button" class="slv-product-filter__group-title" data-slv-filter-toggle aria-expanded="true">
                    <span>分类</span>
                    <svg class="slv-icon" width="16" height="16" aria-hidden="true"><use href="#slv-icon-chevron-down"></use></svg>
                </button>
                <div class="slv-product-filter__group-body">
                    <ul class="slv-product-filter__list">
                        <li><label><input type="checkbox" name="category" value="software" /> 软件产品 <span class="slv-product-filter__count">3</span></label></li>
                        <li><label><input type="checkbox" name="category" value="plugin" /> 插件工具 <span class="slv-product-filter__count">2</span></label></li>
                        <li><label><input type="checkbox" name="category" value="service" /> 服务 <span class="slv-product-filter__count">1</span></label></li>
                    </ul>
                </div>
            </div>

            <!-- 价格 -->
            <div class="slv-product-filter__group">
                <button type="button" class="slv-product-filter__group-title" data-slv-filter-toggle aria-expanded="true">
                    <span>价格</span>
                    <svg class="slv-icon" width="16" height="16" aria-hidden="true"><use href="#slv-icon-chevron-down"></use></svg>
                </button>
                <div class="slv-product-filter__group-body">
                    <div class="slv-product-filter__price">
                        <input type="number" name="min_price" placeholder="最低" min="0" />
                        <span aria-hidden="true">—</span>
                        <input type="number" name="max_price" placeholder="最高" min="0" />
                    </div>
                    <button type="button" class="slv-button slv-button--secondary slv-button--block" data-slv-price-apply>应用</button>
                </div>
            </div>

            <!-- 标签 -->
            <div class="slv-product-filter__group">
                <button type="button" class="slv-product-filter__group-title" data-slv-filter-toggle aria-expanded="true">
                    <span>标签</span>
                    <svg class="slv-icon" width="16" height="16" aria-hidden="true"><use href="#slv-icon-chevron-down"></use></svg>
                </button>
                <div class="slv-product-filter__group-body">
                    <div class="slv-product-filter__tags">
                        <button type="button" class="slv-tag-chip" data-tag="hot">热销</button>
                        <button type="button" class="slv-tag-chip" data-tag="new">新品</button>
                        <button type="button" class="slv-tag-chip" data-tag="sale">促销</button>
                        <button type="button" class="slv-tag-chip" data-tag="featured">推荐</button>
                    </div>
                </div>
            </div>

            <!-- 评分 -->
            <div class="slv-product-filter__group">
                <button type="button" class="slv-product-filter__group-title" data-slv-filter-toggle aria-expanded="true">
                    <span>评分</span>
                    <svg class="slv-icon" width="16" height="16" aria-hidden="true"><use href="#slv-icon-chevron-down"></use></svg>
                </button>
                <div class="slv-product-filter__group-body">
                    <ul class="slv-product-filter__list slv-product-filter__rating">
                        <li>
                            <label>
                                <input type="radio" name="rating" value="4" />
                                <span class="slv-stars">
                                    <svg class="slv-icon slv-icon--filled" width="14" height="14"><use href="#slv-icon-star"></use></svg>
                                    <svg class="slv-icon slv-icon--filled" width="14" height="14"><use href="#slv-icon-star"></use></svg>
                                    <svg class="slv-icon slv-icon--filled" width="14" height="14"><use href="#slv-icon-star"></use></svg>
                                    <svg class="slv-icon slv-icon--filled" width="14" height="14"><use href="#slv-icon-star"></use></svg>
                                </span>
                                4 星以上
                            </label>
                        </li>
                        <li>
                            <label>
                                <input type="radio" name="rating" value="3" />
                                <span class="slv-stars">
                                    <svg class="slv-icon slv-icon--filled" width="14" height="14"><use href="#slv-icon-star"></use></svg>
                                    <svg class="slv-icon slv-icon--filled" width="14" height="14"><use href="#slv-icon-star"></use></svg>
                                    <svg class="slv-icon slv-icon--filled" width="14" height="14"><use href="#slv-icon-star"></use></svg>
                                </span>
                                3 星以上
                            </label>
                        </li>
                    </ul>
                </div>
            </div>
        </aside>

        <!-- 主内容 -->
        <div class="slv-product-list__main">

            <!-- 工具条 -->
            <div class="slv-product-toolbar">
                <div class="slv-product-toolbar__left">
                    <button type="button" class="slv-product-toolbar__filter-toggle" data-slv-filter-open>
                        <svg class="slv-icon" width="18" height="18" aria-hidden="true"><use href="#slv-icon-filter"></use></svg>
                        筛选
                    </button>
                    <span class="slv-product-toolbar__count">共 <strong data-slv-total>12</strong> 件商品</span>
                </div>
                <div class="slv-product-toolbar__right">
                    <select class="slv-product-toolbar__sort" data-slv-sort aria-label="排序">
                        <option value="default">默认排序</option>
                        <option value="latest">最新上架</option>
                        <option value="price-asc">价格从低到高</option>
                        <option value="price-desc">价格从高到低</option>
                        <option value="rating">评分最高</option>
                        <option value="sale">销量最高</option>
                    </select>
                    <div class="slv-product-toolbar__view" role="group" aria-label="视图切换">
                        <button type="button" class="is-active" data-slv-view="grid" aria-label="网格视图">
                            <svg class="slv-icon" width="18" height="18" aria-hidden="true"><use href="#slv-icon-list"></use></svg>
                        </button>
                        <button type="button" data-slv-view="list" aria-label="列表视图">
                            <svg class="slv-icon" width="18" height="18" aria-hidden="true"><use href="#slv-icon-menu"></use></svg>
                        </button>
                    </div>
                </div>
            </div>

            <!-- ═══ 商品网格（关键：用 wp:group 包裹，layout=default） ═══ -->
            <!-- wp:group {"className":"slv-product-grid","layout":{"type":"default"},"metadata":{"name":"商品网格"}} -->
            <div class="wp-block-group slv-product-grid" data-slv-product-grid>
                <!-- wp:query {"queryId":10,"query":{"perPage":12,"postType":"product","order":"desc","orderBy":"date","inherit":false},"layout":{"type":"default"}} -->
                <div class="wp-block-query">
                    <!-- wp:post-template -->
                        <!-- wp:group {"className":"slv-product-card","layout":{"type":"default"}} -->
                        <div class="wp-block-group slv-product-card">
                            <!-- wp:group {"className":"slv-product-card__media","layout":{"type":"default"}} -->
                            <div class="wp-block-group slv-product-card__media">
                                <!-- wp:post-featured-image {"isLink":true,"aspectRatio":"1"} /-->
                                <!-- wp:html -->
                                <div class="slv-product-card__badges">
                                    <span class="slv-product-card__badge slv-product-card__badge--hot">热销</span>
                                </div>
                                <!-- /wp:html -->
                            </div>
                            <!-- /wp:group -->
                            <!-- wp:group {"className":"slv-product-card__body","layout":{"type":"default"}} -->
                            <div class="wp-block-group slv-product-card__body">
                                <!-- wp:post-title {"level":3,"isLink":true} /-->
                                <!-- wp:post-excerpt {"excerptLength":16} /-->
                                <!-- wp:html -->
                                <div class="slv-product-card__footer">
                                    <span class="slv-product-card__price">¥ —</span>
                                    <button type="button" class="slv-product-card__add" aria-label="加入购物车">
                                        <svg class="slv-icon" width="16" height="16" aria-hidden="true"><use href="#slv-icon-shopping-cart"></use></svg>
                                    </button>
                                </div>
                                <!-- /wp:html -->
                            </div>
                            <!-- /wp:group -->
                        </div>
                        <!-- /wp:group -->
                    <!-- /wp:post-template -->
                    <!-- wp:query-no-results -->
                        <!-- wp:paragraph {"align":"center","className":"slv-product-empty"} -->
                        <p class="has-text-align-center slv-product-empty">没有找到匹配的商品，尝试清空筛选条件或更换关键词。</p>
                        <!-- /wp:paragraph -->
                    <!-- /wp:query-no-results -->
                </div>
                <!-- /wp:query -->
            </div>
            <!-- /wp:group -->

            <!-- ═══ 分页 ═══ -->
            <!-- wp:group {"className":"slv-pagination","layout":{"type":"default"}} -->
            <nav class="wp-block-group slv-pagination">
                <!-- wp:query-pagination {"layout":{"type":"flex","justifyContent":"center"}} -->
                    <!-- wp:query-pagination-previous /-->
                    <!-- wp:query-pagination-numbers /-->
                    <!-- wp:query-pagination-next /-->
                <!-- /wp:query-pagination -->
            </nav>
            <!-- /wp:group -->

        </div>
    </div>
</main>

<!-- wp:template-part {"slug":"footer","tagName":"footer","area":"footer"} /-->
