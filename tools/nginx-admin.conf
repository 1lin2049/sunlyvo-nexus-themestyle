# ═══════════════════════════════════════════════════════════
# SunLyvo Nexus — 中台 Nginx 配置片段
#
# 添加到 1Panel → 网站 → sunlyvo.com → 配置文件
# 放在 server { ... } 块内部
# ═══════════════════════════════════════════════════════════

# ─── 子目录模式（sunlyvo.com/admin/）───
location /admin/ {
    alias /opt/1panel/www/sites/sunlyvo.com/index/admin/;

    # config.js 不缓存（动态生成）
    location = /admin/config.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    # SPA 路由回退
    try_files $uri $uri/ /admin/index.html;
}

